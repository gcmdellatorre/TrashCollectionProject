services:
  - type: web
    name: trash-collection-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/trash_reports.db
    disk:
      name: data-disk
      mountPath: /opt/render/project/src/data
      sizeGB: 1 