<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trash Map - MamaLand</title>
    <meta name="description" content="Explore trash locations on the map">
    <meta name="theme-color" content="#10b981">
    <link rel="manifest" href="/static/manifest.json?v=2">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗑️</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        },
                        secondary: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            500: '#64748b',
                            600: '#475569',
                            700: '#334155',
                        },
                        accent: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css"/>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/modern-style.css">
    
    <!-- Dark mode initialization - prevents blinking -->
    <script>
        (function() {
            const savedMode = localStorage.getItem('darkMode');
            const html = document.documentElement;
            
            // Default to light mode if no preference is saved
            if (!savedMode) {
                html.classList.remove('dark');
                localStorage.setItem('darkMode', 'light');
            } else if (savedMode === 'dark') {
                html.classList.add('dark');
            } else {
                html.classList.remove('dark');
            }
        })();
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 font-sans">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50 dark:bg-gray-800 dark:border-gray-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3">
                    <img src="/static/images/Mamaland Beverage Logo - Fun Character Design.png" alt="MamaLand" class="h-8 w-8 rounded-full">
                    <span class="text-xl font-semibold text-gray-900 dark:text-white">MamaLand</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/" class="text-gray-600 hover:text-gray-900 dark:text-gray-300 dark:hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-colors">
                        <i class="bi bi-house mr-1"></i>Home
                    </a>
                    <a href="/report" class="text-gray-600 hover:text-gray-900 dark:text-gray-300 dark:hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-colors">
                        <i class="bi bi-plus-circle mr-1"></i>Report
                    </a>
                    <a href="/map" class="text-primary-600 dark:text-primary-400 px-3 py-2 rounded-md text-sm font-medium transition-colors">
                        <i class="bi bi-map mr-1"></i>Map
                    </a>
                    <a href="/user" class="text-gray-600 hover:text-gray-900 dark:text-gray-300 dark:hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-colors">
                        <i class="bi bi-person mr-1"></i>Profile
                    </a>
                    <button id="dark-mode-toggle" 
                            class="p-2 rounded-lg bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 transition-colors"
                            title="Toggle dark mode">
                        <i class="bi bi-moon-fill text-gray-600 dark:text-yellow-300 dark:hidden"></i>
                        <i class="bi bi-sun-fill text-yellow-500 hidden dark:inline"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden dark:bg-gray-800 dark:border-gray-700">
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center dark:border-gray-700">
                <h2 class="text-lg font-semibold text-gray-900 dark:text-gray-100">Trash Map</h2>
                <button id="refresh-map" class="px-3 py-1 text-sm bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 dark:bg-gray-700 dark:text-gray-100 dark:hover:bg-gray-600">
                    <i class="bi bi-arrow-clockwise mr-1"></i>
                    Refresh
                </button>
            </div>
            
            <!-- Search Section -->
            <div class="p-6 bg-gray-50 border-b border-gray-200 dark:bg-gray-700 dark:border-gray-600">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <!-- Search Input -->
                    <div class="md:col-span-2">
                        <label for="main-map-search" class="sr-only">Search Location</label>
                        <input type="text" id="main-map-search" placeholder="Search for a city or address..." class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 dark:bg-gray-600 dark:border-gray-500 dark:text-gray-100 dark:placeholder-gray-400">
                    </div>
                    
                    <!-- Search Button -->
                    <div>
                        <button id="main-map-search-btn" class="w-full px-4 py-2 bg-primary-600 text-white rounded-lg font-medium hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500">
                            <i class="bi bi-search mr-1"></i>
                            Search
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Find Nearby Section -->
            <div class="p-6 bg-gray-50 border-b border-gray-200 dark:bg-gray-700 dark:border-gray-600">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-center">
                    <!-- Find Nearby Button -->
                    <div class="md:col-span-1">
                        <button id="find-nearby-btn" class="w-full px-4 py-2 bg-accent-600 text-white rounded-lg font-medium hover:bg-accent-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-accent-500">
                            <i class="bi bi-geo-alt mr-1"></i>
                            Find Nearby
                        </button>
                    </div>

                    <!-- Radius Slider -->
                    <div class="md:col-span-2">
                        <label for="radius-slider" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Search Radius: <span id="radius-value">5</span> km</label>
                        <input type="range" id="radius-slider" min="1" max="50" value="5" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer dark:bg-gray-600">
                    </div>
                </div>
            </div>

            <!-- Map Container -->
            <div id="map" class="h-96 lg:h-[calc(100vh-10rem)]" style="min-height: 400px;"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white mt-12 border-t border-gray-200 dark:bg-gray-800 dark:border-gray-700">
        <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8 text-center text-sm text-gray-500 dark:text-gray-400">
            &copy; 2024 MamaLand. All rights reserved.
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/modern-app.js?v=2024061024"></script>
</body>
</html>
