<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Camera Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 8px; }
        .result { margin: 10px 0; padding: 10px; background: #f0f0f0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { padding: 10px 15px; margin: 5px; border: none; border-radius: 4px; cursor: pointer; }
        .primary { background: #007bff; color: white; }
        .secondary { background: #6c757d; color: white; }
    </style>
</head>
<body>
    <h1>Mobile Camera Functionality Test</h1>
    
    <div class="test-section">
        <h2>1. Device Detection Test</h2>
        <button onclick="testDeviceDetection()" class="primary">Test Device Detection</button>
        <div id="device-result" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>2. Camera Input Test</h2>
        <button onclick="testCameraInput()" class="primary">Test Camera Input</button>
        <div id="camera-result" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>3. File Input Test</h2>
        <input type="file" id="test-file-input" accept="video/*" capture="environment" style="display: none;">
        <button onclick="document.getElementById('test-file-input').click()" class="secondary">Test File Input</button>
        <div id="file-result" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>4. Browser Camera API Test</h2>
        <button onclick="testBrowserCamera()" class="primary">Test Browser Camera</button>
        <div id="browser-camera-result" class="result"></div>
        <video id="test-video" style="max-width: 300px; display: none;" autoplay muted></video>
    </div>

    <script>
        // Test 1: Device Detection
        function testDeviceDetection() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const result = document.getElementById('device-result');
            
            result.innerHTML = `
                <strong>User Agent:</strong> ${navigator.userAgent}<br>
                <strong>Is Mobile:</strong> ${isMobile}<br>
                <strong>Platform:</strong> ${navigator.platform}<br>
                <strong>Vendor:</strong> ${navigator.vendor}
            `;
            result.className = 'result success';
        }
        
        // Test 2: Camera Input
        function testCameraInput() {
            const result = document.getElementById('camera-result');
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'video/*';
            input.capture = 'environment';
            
            input.onchange = function(e) {
                if (e.target.files.length > 0) {
                    const file = e.target.files[0];
                    result.innerHTML = `
                        <strong>File selected:</strong> ${file.name}<br>
                        <strong>Size:</strong> ${(file.size / 1024 / 1024).toFixed(2)} MB<br>
                        <strong>Type:</strong> ${file.type}<br>
                        <strong>Last modified:</strong> ${new Date(file.lastModified).toLocaleString()}
                    `;
                    result.className = 'result success';
                } else {
                    result.innerHTML = 'No file selected';
                    result.className = 'result error';
                }
            };
            
            input.click();
        }
        
        // Test 3: File Input Change
        document.getElementById('test-file-input').addEventListener('change', function(e) {
            const result = document.getElementById('file-result');
            if (e.target.files.length > 0) {
                const file = e.target.files[0];
                result.innerHTML = `
                    <strong>File selected:</strong> ${file.name}<br>
                    <strong>Size:</strong> ${(file.size / 1024 / 1024).toFixed(2)} MB<br>
                    <strong>Type:</strong> ${file.type}
                `;
                result.className = 'result success';
            } else {
                result.innerHTML = 'No file selected';
                result.className = 'result error';
            }
        });
        
        // Test 4: Browser Camera API
        function testBrowserCamera() {
            const result = document.getElementById('browser-camera-result');
            const video = document.getElementById('test-video');
            
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                result.innerHTML = 'Browser camera API not supported';
                result.className = 'result error';
                return;
            }
            
            navigator.mediaDevices.getUserMedia({ 
                video: { 
                    width: { ideal: 640 },
                    height: { ideal: 480 },
                    facingMode: 'environment'
                },
                audio: false 
            })
            .then(function(stream) {
                video.srcObject = stream;
                video.style.display = 'block';
                result.innerHTML = 'Camera access granted! Video should be visible above.';
                result.className = 'result success';
            })
            .catch(function(error) {
                result.innerHTML = `Camera access denied: ${error.message}`;
                result.className = 'result error';
            });
        }
        
        // Auto-run device detection on load
        window.onload = function() {
            testDeviceDetection();
        };
    </script>
</body>
</html>
